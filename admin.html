<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — My Study Cards</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="admin.html">
        <span class="brand-mark">SC</span>
        <span>Admin</span>
      </a>
      <div class="topbar-actions">
        <div class="profile-chip" id="profileChip" style="display:none;"></div>
        <a class="btn btn-ghost btn-sm" href="index.html">View site</a>
        <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle dark mode">🌓</button>
      </div>
    </div>
  </header>

  <div class="auth-gate" id="authGate">
    <h1>Admin sign-in</h1>
    <p>Sign in with the Google account authorized to manage this study library. Access is verified on the server — no password is stored in this page.</p>
    <div id="g_id_button_wrap"></div>
    <p id="gateStatus"></p>
  </div>

  <main class="container admin-shell" id="adminShell" style="display:none;">
    <div id="adminRoot"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
